<style>
:root {
  --bg: #121011;        /* wet stone at night */
  --stone: #1d1a1a;
  --bone: #ece4d6;      /* skeleton bone */
  --muted: #958c84;     /* overcast grey */
  --line: #3a3433;
  --red: #c81e1e;       /* the flowers */
  --red-hover: #e02a26;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--bone);
  font-family: var(--sans); -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--bone); outline-offset: 4px; }

/* ---------- logo ---------- */
.mark { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px;
  width: 34px; height: 34px; color: var(--bone); z-index: 3; opacity: .92; filter: drop-shadow(0 1px 6px rgba(0,0,0,.5)); }
.mark svg { display: block; width: 100%; height: 100%; }

/* ---------- hero / cover ---------- */
.hero { position: relative; width: 100%; }
.cover { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; background: var(--stone); }
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.cover::after { /* fade the bottom of the cover into the page */
  content: ""; position: absolute; inset: auto 0 0 0; height: 38%;
  background: linear-gradient(to bottom, rgba(18,16,17,0) 0%, rgba(18,16,17,.75) 60%, var(--bg) 100%);
  pointer-events: none;
}
.play {
  position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); z-index: 2;
  width: 88px; height: 88px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  background: rgba(18,16,17,.62); color: var(--bone);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  display: grid; place-items: center;
  box-shadow: 0 10px 30px -8px rgba(0,0,0,.7);
  transition: transform .15s ease, background .15s ease;
}
.play:hover { background: rgba(18,16,17,.78); }
.play:active { transform: translateX(-50%) scale(.96); }
.play .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.play .ring circle { fill: none; stroke-width: 3; }
.play .ring .track { stroke: rgba(236,228,214,.35); }
.play .ring .prog { stroke: var(--red); stroke-linecap: round; stroke-dasharray: 270.2; stroke-dashoffset: 270.2; }
.play .icon { width: 28px; height: 28px; position: relative; }
.play .i-pause { display: none; }
.play.is-playing .i-play { display: none; }
.play.is-playing .i-pause { display: block; }
.play:not(.has-played)::before { /* gentle invite to tap, only until first play */
  content: ""; position: absolute; inset: -6px; border-radius: 50%;
  border: 1.5px solid rgba(236,228,214,.55); animation: pulse 2.2s ease-out infinite;
}
@keyframes pulse { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
.play-label {
  position: absolute; left: 0; right: 0; bottom: calc(13% - 30px); z-index: 2; margin: 0;
  text-align: center; font-size: .7rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase;
  color: var(--bone); opacity: .85;
}

/* ---------- info ---------- */
.info { padding: 22px 24px 0; max-width: 480px; margin: 0 auto; text-align: center; }
h1 {
  font-family: var(--serif); font-weight: 800; font-size: clamp(3rem, 15vw, 4.6rem);
  line-height: .95; letter-spacing: .04em; margin: 0; text-transform: uppercase;
}
.byline { margin: 12px 0 0; font-size: .78rem; font-weight: 700; letter-spacing: .34em; text-transform: uppercase; color: var(--muted); }
.line { margin: 20px 0 28px; font-size: 1.05rem; line-height: 1.5; color: var(--bone); font-weight: 500; }

.cta {
  display: block; width: 100%; padding: 19px 24px; border-radius: 4px;
  background: var(--red); color: #fff; text-decoration: none; text-align: center;
  font-weight: 700; font-size: 1rem; letter-spacing: .14em; text-transform: uppercase;
  box-shadow: 0 12px 28px -12px rgba(200,30,30,.75);
  transition: background .15s ease, transform .15s ease;
}
.cta:hover { background: var(--red-hover); }
.cta:active { transform: translateY(1px); }
.cta.nudge { animation: nudge .9s ease 2; }
@keyframes nudge { 0%,100% { transform: none; } 30% { transform: translateY(-4px); } 60% { transform: translateY(0); } }

.more { margin-top: 10px; }
.more summary {
  list-style: none; cursor: pointer; padding: 14px 0; color: var(--muted);
  font-size: .8rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
}
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: " +"; }
.more[open] summary::after { content: " –"; }
.more summary:hover { color: var(--bone); }
.apps { list-style: none; padding: 0; margin: 0 0 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.apps a {
  display: block; padding: 13px 10px; border: 1px solid var(--line); border-radius: 4px;
  text-decoration: none; font-weight: 500; font-size: .92rem; color: var(--bone);
  transition: border-color .15s ease;
}
.apps a:hover { border-color: var(--bone); }
@media (max-width: 899px) { .apps li:last-child:nth-child(odd) { grid-column: 1 / -1; } }

/* ---------- mailing list ---------- */
.join { margin: 56px 0 0; padding-top: 32px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 8px; text-align: left; }
.join h2 { grid-column: 1 / -1; margin: 0 0 8px;font-size: .8rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
.join p.hint { grid-column: 1 / -1; margin: 0 0 8px; color: var(--muted); font-size: .9rem; }
.join input[type="email"] {
  width: 100%; min-width: 0; padding: 13px 14px; border-radius: 4px; border: 1px solid var(--line);
  background: var(--stone); color: var(--bone); font: inherit; font-size: 1rem;
}
.join input[type="email"]::placeholder { color: var(--muted); }
.join input[type="email"]:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }
.join button {
  padding: 13px 18px; border-radius: 4px; border: 1px solid var(--bone); background: transparent; color: var(--bone);
  font: inherit; font-weight: 700; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
}
.join button:hover { background: var(--bone); color: var(--bg); }
.join button:disabled { opacity: .5; cursor: default; }
.join .msg { grid-column: 1 / -1; min-height: 1.2em; margin: 0; font-size: .9rem; color: var(--muted); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

footer { text-align: center; padding: 48px 24px calc(36px + env(safe-area-inset-bottom)); color: var(--muted); font-size: .72rem; letter-spacing: .12em; }
footer .tag { display: block; margin-bottom: 6px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--bone); opacity: .7; }
footer a { text-decoration: none; }
footer a:hover { color: var(--bone); }

/* ---------- desktop ---------- */
@media (min-width: 900px) {
  body { display: grid; place-items: center; }
  .page { width: 100%; max-width: 1120px; padding: 64px 48px 0; display: grid; grid-template-columns: 540px 1fr; column-gap: 72px; align-items: center; }
  .mark { position: fixed; top: 28px; left: 32px; transform: none; width: 38px; height: 38px; }
  .cover { border-radius: 4px; box-shadow: 0 40px 70px -30px rgba(0,0,0,.9); }
  .cover::after { height: 30%; background: linear-gradient(to bottom, rgba(18,16,17,0), rgba(18,16,17,.55)); }
  .info { padding: 0; margin: 0; text-align: left; max-width: 440px; }
  h1 { font-size: 5.4rem; }
  .apps { grid-template-columns: 1fr 1fr 1fr; }
  footer { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  .play:not(.has-played)::before, .cta.nudge { animation: none; }
  .play, .cta, .apps a { transition: none; }
}
</style>
</head>
<body>

<main class="page">
  <section class="hero">
    <div class="cover">
      <img src="cover-720.jpg" srcset="cover-720.jpg 720w, cover.jpg 1200w" sizes="(min-width: 900px) 540px, 100vw"
           width="1200" height="1200" fetchpriority="high" decoding="async" alt="Vilify cover art: a skeleton rising from a grave by the ocean, among red flowers">
    </div>
    <button class="play" id="play" type="button" aria-label="Play a 25-second preview of Vilify">

      </svg>
      <svg class="icon i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l13-7.5z"/></svg>

<script>
(function () {
  function track(name, data) { try { if (window.umami) umami.track(name, data); } catch (e) {} }

  /* ----- preview player ----- */
  var audio = document.getElementById('audio'),
      btn = document.getElementById('play'),
      label = document.getElementById('play-label'),
      prog = document.getElementById('prog'),
      cta = document.getElementById('cta'),
      CIRC = 270.2, started = false, half = false;

  btn.addEventListener('click', function () {
    if (audio.paused) {
      var p = audio.play();
      if (p && p.catch) p.catch(function () { track('preview-error'); });
    } else {
      audio.pause();
    }
  });
  audio.addEventListener('play', function () {
    btn.classList.add('is-playing', 'has-played');
    btn.setAttribute('aria-label', 'Pause preview');
    label.textContent = 'Playing';
    if (!started) { started = true; track('preview-play'); } else { track('preview-replay'); }
  });
  audio.addEventListener('pause', function () {
    btn.classList.remove('is-playing');
    btn.setAttribute('aria-label', 'Play preview');
    if (!audio.ended) {
      label.textContent = 'Paused';
      track('preview-pause', { second: Math.round(audio.currentTime) });
    }
  });
  audio.addEventListener('timeupdate', function () {
    if (!audio.duration) return;
    var r = audio.currentTime / audio.duration;
    prog.style.strokeDashoffset = CIRC * (1 - r);
    if (!half && r >= 0.5) { half = true; track('preview-50'); }
  });
  audio.addEventListener('ended', function () {
    track('preview-complete');
    label.textContent = 'Full track on Spotify';
    prog.style.strokeDashoffset = CIRC;
    cta.classList.remove('nudge'); void cta.offsetWidth; cta.classList.add('nudge');
  });

  /* ----- other apps ----- */
  var more = document.getElementById('more');
  more.addEventListener('toggle', function () { track(more.open ? 'more-platforms' : 'more-platforms-close'); });

  /* ----- mailing list ----- */
  var f = document.getElementById('join'),
      msg = f.querySelector('.msg'), sub = f.querySelector('button');
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var input = f.elements['email'];
    if (!input.value.trim() || !input.checkValidity()) { msg.textContent = 'Enter a valid email address.'; track('subscribe-invalid'); return; }
    sub.disabled = true; msg.textContent = '';
    track('subscribe-attempt');
    fetch('https://formsubmit.co/ajax/oceanleans@gmail.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email: input.value.trim(), _subject: 'New OceanLeans subscriber', _honey: f.elements['_honey'].value })
    }).then(function (r) {
      if (!r.ok) throw new Error('failed');
      f.reset(); msg.textContent = 'You’re in. Next one comes to you first.';
      track('subscribe');
    }).catch(function () {
      track('subscribe-error');
      msg.textContent = 'Something went wrong. Try again in a moment.';
    }).then(function () { sub.disabled = false; });
  });
})();
</script>
