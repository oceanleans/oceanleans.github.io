<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OceanLeans – Vilify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e7e4e0;
  --ink: #26201f;
  --muted: #6a615d;
  --accent: #9b1c1c;
  --accent-ink: #fbf3ef;
  --line: #c6beb8;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151212; --ink: #ece6e0; --muted: #a0958e;
    --accent: #c4302b; --accent-ink: #fbf3ef; --line: #3a3130;
  }
}
:root[data-theme="dark"] {
  --bg: #151212; --ink: #ece6e0; --muted: #a0958e;
  --accent: #c4302b; --accent-ink: #fbf3ef; --line: #3a3130;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; justify-content: center;
}
main {
  width: 100%; max-width: 440px; padding: 40px 24px 48px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.wordmark { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 36px; }
.cover {
  width: min(100%, 340px); aspect-ratio: 1; border-radius: 6px; overflow: hidden;
  transform: rotate(-3deg); transform-origin: 50% 100%;
  box-shadow: 0 24px 40px -18px rgba(20, 8, 8, 0.6);
  animation: lean 1.6s cubic-bezier(.2,.8,.2,1) 1 both;
}
.cover img, .cover svg { display: block; width: 100%; height: 100%; object-fit: cover; }
@keyframes lean { from { transform: rotate(3deg); } to { transform: rotate(-3deg); } }
h1 { font-size: 2.3rem; line-height: 1.05; font-weight: 800; margin: 36px 0 6px; letter-spacing: -0.02em; }
.sub { margin: 0 0 24px; color: var(--muted); font-size: 1rem; }
.listen {
  display: block; width: 100%; padding: 16px 24px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); text-decoration: none;
  font-weight: 600; font-size: 1.05rem;
  transition: transform .15s ease;
}
.listen[aria-disabled] { opacity: .6; cursor: default; }
.listen[aria-disabled]:hover { transform: none; }
.listen:active { transform: translateY(0); }
a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.socials {
  list-style: none; padding: 0; margin: 44px 0 0; width: 100%;
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.socials a {
  display: block; padding: 13px 10px; border: 1.5px solid var(--line); border-radius: 12px;
  color: var(--ink); text-decoration: none; font-weight: 600; font-size: 0.95rem;
  transition: border-color .15s ease, background .15s ease;
}
.socials a:hover { border-color: var(--ink); }
footer { margin-top: 40px; color: var(--muted); font-size: 0.8rem; }
.info { width: 100%; display: flex; flex-direction: column; align-items: center; }
@media (min-width: 900px) {
  main {
    max-width: 1080px; padding: 56px 48px 40px; text-align: left;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: auto 1fr auto; column-gap: 80px; align-items: center;
  }
  .wordmark { grid-column: 1 / -1; justify-self: start; margin: 0; font-size: 1.25rem; }
  .cover { grid-column: 1; width: 100%; max-width: 500px; justify-self: center; }
  .info { grid-column: 2; align-items: flex-start; max-width: 440px; }
  h1 { font-size: 4rem; margin-top: 0; }
  .sub { font-size: 1.15rem; margin-bottom: 28px; }
  .socials { margin-top: 36px; }
  footer { grid-column: 1 / -1; margin-top: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .cover { animation: none; }
  .listen, .socials a { transition: none; }
}
</style>
</head>
