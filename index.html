<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="OceanLeans — STOP THE ROBOTS. Stream the latest release."
  >

  <meta name="theme-color" content="#050505">

  <title>OceanLeans — STOP THE ROBOTS</title>

  <style>
    :root {
      --bg: #050505;
      --text: #f5f5f5;
      --muted: #888;
      --line: rgba(255, 255, 255, 0.14);
      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    header,
    main,
    footer {
      width: min(100% - 40px, var(--max-width));
      margin: 0 auto;
    }

    /* HEADER */

    header {
      padding: 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .release-label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* MAIN */

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 40px 0 80px;
    }

    .release {
      width: 100%;
      display: grid;
      grid-template-columns:
        minmax(280px, 600px)
        minmax(260px, 420px);

      gap: clamp(40px, 8vw, 120px);

      align-items: center;
    }

    /* ARTWORK */

    .artwork {
      width: 100%;
      aspect-ratio: 1 / 1;

      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at 30% 25%,
          rgba(255, 255, 255, 0.12),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #181818,
          #080808
        );

      border: 1px solid var(--line);
      overflow: hidden;
    }

    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .artwork-placeholder {
      color: #666;
      font-size: clamp(12px, 1.4vw, 16px);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    /* SONG DETAILS */

    .details {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .eyebrow {
      margin: 0 0 18px;

      color: var(--muted);

      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(38px, 5vw, 76px);
      line-height: 0.94;
      letter-spacing: -0.055em;
      font-weight: 700;
    }

    /* STREAM BUTTON */

    .stream-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 58px;

      margin-top: 36px;
      padding: 0 32px;

      background: var(--text);
      color: var(--bg);

      border: 1px solid var(--text);
      border-radius: 999px;

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .stream-button:hover {
      transform: translateY(-2px);
      opacity: 0.88;
    }

    .stream-button:focus-visible,
    .social-link:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    /* FOOTER */

    footer {
      padding: 28px 0;

      border-top: 1px solid var(--line);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 24px;
    }

    .copyright {
      color: var(--muted);

      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .social-link {
      color: var(--muted);

      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;

      transition: color 0.2s ease;
    }

    .social-link:hover {
      color: var(--text);
    }

    /* TABLET + MOBILE */

    @media (max-width: 800px) {

      header {
        padding: 22px 0;
      }

      main {
        padding: 28px 0 60px;
      }

      .release {
        grid-template-columns: 1fr;
        gap: 34px;

        max-width: 620px;
        margin: 0 auto;
      }

      .details {
        align-items: center;
        text-align: center;
      }

      h1 {
        font-size: clamp(42px, 11vw, 68px);
      }

      .stream-button {
        width: min(100%, 360px);
      }

      footer {
        flex-direction: column;
        align-items: center;

        padding: 24px 0;
      }
    }

    /* SMALL MOBILE */

    @media (max-width: 480px) {

      header,
      main,
      footer {
        width: min(100% - 28px, var(--max-width));
      }

      .release {
        gap: 28px;
      }

      .stream-button {
        margin-top: 30px;
      }

      .socials {
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }
    }

    /* REDUCED MOTION */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      .stream-button {
        transition: none;
      }
    }
  </style>
</head>


<body>

  <div class="page">

    <!-- HEADER -->

    <header>

      <a
        class="logo"
        href="/"
        aria-label="OceanLeans home"
      >
        OceanLeans
      </a>

      <span class="release-label">
        Latest Release
      </span>

    </header>


    <!-- MAIN RELEASE -->

    <main>

      <section
        class="release"
        aria-labelledby="song-title"
      >


        <!-- ARTWORK -->

        <div class="artwork">
  <img
    src="STOP THE ROBOTS_AC.png"
    alt="STOP THE ROBOTS artwork"
  >
</div>


        <!-- SONG INFORMATION -->

        <div class="details">

          <p class="eyebrow">
            OceanLeans
          </p>

          <h1 id="song-title">
            STOP THE ROBOTS
          </h1>


          <!-- PRIMARY CTA -->

          <a
            class="stream-button"
            href="https://artists.landr.com/StopTheRobots"
            target="_blank"
            rel="noopener noreferrer"
          >
            STREAM THE SONG
          </a>

        </div>

      </section>

    </main>


    <!-- FOOTER -->

    <footer>

      <span class="copyright">
        © OceanLeans
      </span>


      <nav
        class="socials"
        aria-label="Social media"
      >

        <a
          class="social-link"
          href="https://www.youtube.com/@OceanLeansArchive"
          target="_blank"
          rel="noopener noreferrer"
        >
          YouTube
        </a>

        <a
          class="social-link"
          href="https://www.instagram.com/oceanleans/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagram
        </a>

        <a
          class="social-link"
          href="https://www.tiktok.com/@oceanleans"
          target="_blank"
          rel="noopener noreferrer"
        >
          TikTok
        </a>

        <a
          class="social-link"
          href="https://www.facebook.com/profile.php?id=61563285745056"
          target="_blank"
          rel="noopener noreferrer"
        >
          Facebook
        </a>

      </nav>

    </footer>

  </div>

</body>
</html>
