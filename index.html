<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OceanLeans – Vilify</title>
<script defer src="https://cloud.umami.is/script.js" data-website-id="c015d824-883f-46fd-8e64-ae8db943ce3f"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e7e4e0;
  --ink: #26201f;
  --muted: #6a615d;
  --accent: #9b1c1c;
  --accent-ink: #fbf3ef;
  --line: #c6beb8;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151212; --ink: #ece6e0; --muted: #a0958e;
    --accent: #c4302b; --accent-ink: #fbf3ef; --line: #3a3130;
  }
}
:root[data-theme="dark"] {
  --bg: #151212; --ink: #ece6e0; --muted: #a0958e;
  --accent: #c4302b; --accent-ink: #fbf3ef; --line: #3a3130;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; justify-content: center;
}
main {
  width: 100%; max-width: 440px; padding: 48px 24px 72px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.wordmark { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 52px; }
.cover {
  width: 100%; aspect-ratio: 1; border-radius: 6px; overflow: hidden;
  transform: rotate(-3deg); transform-origin: 50% 100%;
  box-shadow: 0 24px 40px -18px rgba(20, 8, 8, 0.6);
  animation: lean 1.6s cubic-bezier(.2,.8,.2,1) 1 both;
}
.cover img, .cover svg { display: block; width: 100%; height: 100%; object-fit: cover; }
@keyframes lean { from { transform: rotate(3deg); } to { transform: rotate(-3deg); } }
h1 { font-size: 3rem; line-height: 1.02; font-weight: 800; margin: 44px 0 28px; letter-spacing: -0.02em; }
.sub { margin: 0 0 28px; color: var(--muted); font-size: 1.1rem; }
.listen {
  display: block; width: 100%; padding: 20px 24px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); text-decoration: none;
  font-weight: 600; font-size: 1.2rem;
  transition: transform .15s ease;
}
.listen:hover { transform: translateY(-2px); }
.listen:active { transform: translateY(0); }
a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.socials {
  list-style: none; padding: 0; margin: 48px 0 0; width: 100%;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px;
}
.socials a {
  display: block; padding: 6px 0; border-bottom: 1.5px solid transparent;
  color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.85rem;
  transition: border-color .15s ease, background .15s ease;
}
.socials a:hover { color: var(--ink); border-bottom-color: var(--ink); }
footer { margin-top: 48px; color: var(--muted); font-size: 0.8rem; }
.info { width: 100%; display: flex; flex-direction: column; align-items: center; }
.join { width: 100%; margin-top: 64px; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.join h2 { grid-column: 1 / -1; margin: 0 0 2px; font-size: 1.05rem; font-weight: 600; }
.join input[type="email"] { width: 100%; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 1rem; }
.join input[type="email"]::placeholder { color: var(--muted); }
.join input[type="email"]:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-color: var(--ink); }
.join button { padding: 12px 20px; border-radius: 10px; border: 0; background: var(--ink); color: var(--bg); font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer; }
.join button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.join button:disabled { opacity: .6; cursor: default; }
.join .msg { grid-column: 1 / -1; min-height: 1.2em; margin: 0; font-size: .9rem; color: var(--muted); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (min-width: 900px) {
  main {
    max-width: 1080px; padding: 56px 48px 40px; text-align: left;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: auto 1fr auto; column-gap: 80px; align-items: center;
  }
  .wordmark { grid-column: 1 / -1; justify-self: start; margin: 0; font-size: 1.25rem; }
  .cover { grid-column: 1; width: 100%; max-width: 560px; justify-self: center; }
  .info { grid-column: 2; align-items: flex-start; max-width: 480px; }
  h1 { font-size: 4.8rem; margin-top: 0; }
  .sub { font-size: 1.25rem; margin-bottom: 36px; }
  .socials { margin-top: 44px; justify-content: flex-start; }
  footer { grid-column: 1 / -1; margin-top: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .cover { animation: none; }
  .listen, .socials a { transition: none; }
}
</style>
</head>
<body>
<main>
  <p class="wordmark">OceanLeans</p>

  <div class="cover"><img src="cover.jpg" alt="Cover art for Vilify by OceanLeans" width="900" height="900"></div>

  <div class="info">
    <h1>Vilify</h1>

    <a class="listen" href="listen.html" data-umami-event="listen-now">Listen now</a>

    <form class="join" id="join" novalidate>
      <h2>Join the mailing list</h2>
      <label for="email" class="sr">Email address</label>
      <input id="email" name="email" type="email" required placeholder="Your email" autocomplete="email">
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">Subscribe</button>
      <p class="msg" role="status" aria-live="polite"></p>
    </form>

    <ul class="socials">
      <li><a href="https://www.youtube.com/@OceanLeans" rel="noopener" target="_blank">YouTube</a></li>
      <li><a href="https://www.instagram.com/oceanleans/" rel="noopener" target="_blank">Instagram</a></li>
      <li><a href="https://www.tiktok.com/@oceanleans" rel="noopener" target="_blank">TikTok</a></li>
      <li><a href="https://www.facebook.com/profile.php?id=61563285745056" rel="noopener" target="_blank">Facebook</a></li>
    </ul>
  </div>

  <footer>© LeaningOcean Entertainment</footer>
</main>
<script>
(function () {
  var f = document.getElementById('join');
  if (!f) return;
  var msg = f.querySelector('.msg'), btn = f.querySelector('button');
  function track(n) { try { if (window.umami) umami.track(n); } catch (e) {} }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var input = f.elements['email'];
    if (!input.value.trim() || !input.checkValidity()) { msg.textContent = 'Enter a valid email address.'; return; }
    btn.disabled = true; msg.textContent = '';
    track('subscribe-attempt');
    fetch('https://formsubmit.co/ajax/oceanleans@gmail.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email: input.value.trim(), _subject: 'New OceanLeans subscriber', _honey: f.elements['_honey'].value })
    }).then(function (r) {
      if (!r.ok) throw new Error('failed');
      f.reset(); msg.textContent = 'You’re in. Thanks for joining.';
      track('subscribe');
    }).catch(function () {
      track('subscribe-error');
      msg.textContent = 'Something went wrong. Try again in a moment.';
    }).then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
